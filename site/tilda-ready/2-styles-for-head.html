<style>
/* ============================================================
   ПУШКИН. ЖИВОЙ — мультимедийная выставка, Екатеринбург
   Направление: «Живая рукопись»

   Страница устроена как разворот пушкинской тетради.
   Бумага холодная, серо-зелёная — Пушкин писал на бумаге верже,
   а не на тёплом пергаменте. Чернила железистые, за двести лет
   побуревшие: не чёрные и не синие. Слева через всю страницу идут
   поля — в них он рисовал профили и заносил пометки, туда же уходят
   надчерки разделов. Картины ложатся вклейками на паспарту.

   Блок CSS для Tilda. Всё изолировано под классом .pj
   ============================================================ */

.pj,
.pj *,
.pj *::before,
.pj *::after { box-sizing: border-box; }

.pj {
  /* — бумага верже — */
  --void:    #E2E4DE;   /* лист */
  --paper:   #EDEEE9;   /* вклейки, карточки — светлее листа */
  --raise:   #E7E8E2;
  --night:   #D8DAD3;   /* утопленное */
  --panel:   #EDEEE9;
  --line:    #BDBFB6;   /* линовка, хайрлайны */
  --line-2:  #CFD1C9;
  --field:   #7E796C;   /* границы полей и кнопок: 3.39:1 на листе, WCAG 1.4.11 */

  /* — железистые чернила — */
  --snow:    #2A2118;   /* основной текст */
  --dim:     #5A4B39;   /* второстепенный */
  --mute:    #6E6353;   /* третьестепенный, проверен на контраст */

  /* — сургуч — */
  --candle:  #7A2E22;   /* акцент: зачёркивания, ссылки, кнопки */
  --candle-l:#C08A3E;   /* тёплое золото поверх тёмных вклеек */
  --candle-d:#5A1F17;
  --surguch: #7A2E22;
  --frame:   #1C1811;   /* фон под кадром фильма */

  --maxw: 1400px;
  --navh: 62px;
  --pad: clamp(20px, 5vw, 76px);
  --margin: clamp(96px, 15vw, 232px);  /* ширина полей тетради */
  --seam: 2px;

  --f-display: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
  --f-body: 'Literata', 'Georgia', 'Times New Roman', serif;
  --f-label: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
  --f-hand: 'Caveat', 'Segoe Script', cursive;

  /* вержеры и понтюзо — та самая фактура бумаги ручного отлива */
  --laid: repeating-linear-gradient(0deg, transparent 0 3px, rgba(42,33,24,.030) 3px 4px);
  --chain: repeating-linear-gradient(90deg, transparent 0 44px, rgba(42,33,24,.045) 44px 45px);

  position: relative;
  margin: 0;
  padding: 0;
  color: var(--snow);
  background-color: var(--void);
  background-image: var(--laid), var(--chain);
  font-family: var(--f-body);
  font-size: clamp(15px, 0.5vw + 13.4px, 17px);
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
  touch-action: manipulation;
}

.pj img { max-width: 100%; display: block; }
.pj a { color: inherit; text-decoration: none; }
.pj p { margin: 0; }
.pj h1, .pj h2, .pj h3, .pj h4 { margin: 0; font-weight: 400; text-wrap: balance; }
.pj ul, .pj ol { margin: 0; padding: 0; list-style: none; }
.pj button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.pj :focus-visible { outline: 2px solid var(--candle); outline-offset: 3px; }

/* ---------- типографика ---------- */
.pj-display { font-family: var(--f-display); font-weight: 600; line-height: 0.96; }
.pj-h2 {
  font-family: var(--f-display); font-weight: 600;
  font-size: clamp(2.1rem, 5vw, 4.3rem);
  line-height: 1.02; letter-spacing: -0.012em;
}
.pj-h3 { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.35rem, 2.2vw, 2rem); line-height: 1.14; }
.pj-lead { font-size: clamp(1.06rem, 1.3vw, 1.28rem); line-height: 1.6; color: var(--dim); max-width: 60ch; }
.pj-body { max-width: 64ch; color: var(--dim); }
.pj-dim { color: var(--mute); }

/* надчерк — уходит на поля, как пометка на полях тетради */
.pj-slug {
  font-family: var(--f-label);
  font-size: 0.9375rem;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--candle);
  line-height: 1.4;
}
.pj-slug--dim { color: var(--mute); }

/* рукописная пометка */
.pj-hand { font-family: var(--f-hand); font-weight: 600; font-size: 1.25rem; color: var(--dim); line-height: 1.35; }

.pj-num { font-variant-numeric: tabular-nums; }

/* ---------- каркас ---------- */
.pj-bleed { width: 100vw; margin-left: calc(50% - 50vw); }
.pj-wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }
.pj-sec { position: relative; padding-block: clamp(68px, 9vw, 136px); }
.pj-sec--tight { padding-block: clamp(52px, 6.5vw, 96px); }
.pj-rule { height: 1px; background: var(--line); opacity: .8; }

/* шапка раздела: надчерк живёт на полях, заголовок — в наборной полосе */
.pj-sechead { display: grid; gap: 14px; margin-bottom: clamp(30px, 3.6vw, 52px); }
.pj-sechead__row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
@media (min-width: 940px) {
  .pj-sechead {
    grid-template-columns: var(--margin) minmax(0, 1fr);
    column-gap: clamp(24px, 3vw, 56px);
    align-items: start;
  }
  .pj-sechead > .pj-slug,
  .pj-sechead > .pj-sechead__row { grid-column: 1; }
  .pj-sechead__row { flex-direction: column; align-items: flex-start; gap: 8px; }
  .pj-sechead > .pj-h2,
  .pj-sechead > .pj-body,
  .pj-sechead > .pj-lead { grid-column: 2; }
  /* тонкая линия сгиба полей */
  .pj-sechead > .pj-h2 { position: relative; }
  .pj-sechead > .pj-h2::before {
    content: ''; position: absolute;
    left: calc(-1 * clamp(24px, 3vw, 56px) / 2); top: .12em; bottom: -.1em;
    width: 1px; background: var(--line);
  }
}

/* ---------- вклейка: кадр фильма на паспарту ---------- */
.pj-tri { display: grid; grid-template-columns: 1fr 1.86fr 1fr; gap: clamp(10px, 1.4vw, 22px); align-items: stretch; }

.pj-screen {
  position: relative;
  overflow: hidden;
  background: var(--frame);
  isolation: isolate;
  box-shadow:
    0 0 0 1px rgba(42,33,24,.16),
    0 14px 28px -20px rgba(42,33,24,.65);
}
.pj-screen::after {
  content: ''; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(237,238,233,.14);
}
.pj-screen__img {
  position: absolute; inset: 0; z-index: 2;
  width: 100%; height: 100%;
  object-fit: cover;
  filter: saturate(1.02) contrast(1.01);
}
.pj-screen__img--gen { opacity: 0; transition: opacity .6s ease; }
.pj-screen__img--gen.is-in { opacity: 1; }
.pj-screen__wash {
  position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(90% 70% at var(--wx, 30%) var(--wy, 25%), var(--washA, rgba(192,138,62,.20)), transparent 62%),
    linear-gradient(168deg, #26211a, var(--frame) 72%);
}
/* подпись под вклейкой — рукой, как в альбоме */
.pj-screen__cap {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 26px 14px 11px;
  font-family: var(--f-hand);
  font-size: 1.0625rem;
  line-height: 1.3;
  color: #EFEFE9;
  background: linear-gradient(transparent, rgba(20,17,11,.86) 62%);
}
.pj-screen__tag {
  position: absolute; top: 11px; left: 12px; z-index: 3;
  font-family: var(--f-label);
  font-size: 0.75rem; font-weight: 700;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: rgba(239,239,233,.62);
}

/* ---------- ПРОЛОГ: разворот тетради ---------- */
.pj-hero {
  position: relative;
  min-height: calc(100svh - var(--navh));
  display: flex; flex-direction: column; justify-content: center;
  padding-block: clamp(28px, 5vh, 64px);
  overflow: hidden;
  background-color: var(--void);
  background-image: var(--laid), var(--chain);
}
.pj-hero__snow { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: .5; }

.pj-hero__in {
  position: relative; z-index: 3;
  width: 100%; max-width: var(--maxw); margin: 0 auto;
  padding-inline: var(--pad);
  display: grid; gap: clamp(20px, 3vh, 38px);
}
.pj-hero__top {
  display: flex; justify-content: space-between; gap: 12px 26px; flex-wrap: wrap;
  padding-bottom: 14px; border-bottom: 1px solid var(--line);
}

.pj-title { margin: 0; }
.pj-title__l1, .pj-title__l2 {
  display: block;
  font-family: var(--f-display); font-weight: 600;
  font-size: clamp(3.2rem, 13vw, 12.5rem);
  line-height: 0.86;
  letter-spacing: -0.028em;
}
.pj-title__l2 { color: var(--candle); padding-left: 0.04em; }

.pj-hero__line { font-size: clamp(1.05rem, 1.4vw, 1.42rem); line-height: 1.5; color: var(--dim); max-width: 44ch; }
.pj-hero__bottom { display: flex; flex-wrap: wrap; align-items: center; gap: clamp(14px, 2.4vw, 40px); }
.pj-hero__dates { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.3rem, 2.3vw, 2.15rem); white-space: nowrap; }
.pj-hero__bottom .pj-cta { margin-top: 0; }

/* три вклейки в подвале разворота */
.pj-hero__tri {
  position: relative; z-index: 2;
  width: 100%; max-width: var(--maxw); margin: 0 auto;
  padding-inline: var(--pad);
  display: grid; grid-template-columns: 1fr 1.7fr 1fr;
  gap: clamp(12px, 1.6vw, 26px);
  margin-top: clamp(22px, 3vh, 40px);
}
.pj-hero__panel {
  position: relative; overflow: hidden;
  aspect-ratio: 3 / 4;
  background: var(--frame);
  box-shadow: 0 0 0 1px rgba(42,33,24,.16), 0 16px 30px -20px rgba(42,33,24,.7);
}
.pj-hero__panel--c { aspect-ratio: 16 / 11; }
.pj-hero__panel--l { transform: rotate(-0.5deg); }
.pj-hero__panel--r { transform: rotate(0.45deg); }
.pj-hero__v {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  filter: saturate(1.02) contrast(1.01);
}
.pj-hero__scrim { display: none; }

/* «листайте» — на полях, рукой */
.pj-scroll {
  position: absolute; z-index: 3;
  right: var(--pad); bottom: clamp(14px, 2.4vh, 28px);
  display: grid; justify-items: center; gap: 8px;
}
.pj-scroll__t { font-family: var(--f-hand); font-weight: 600; font-size: 1.0625rem; color: var(--mute); }
.pj-scroll__l {
  width: 1px; height: clamp(24px, 4vh, 44px);
  background: linear-gradient(var(--candle), transparent);
  transform-origin: top;
  animation: pj-drop 2.4s ease-in-out infinite;
}
@keyframes pj-drop { 0%,100% { transform: scaleY(.35); opacity:.45 } 50% { transform: scaleY(1); opacity:.95 } }
.pj-scroll:hover .pj-scroll__t { color: var(--candle); }

/* ---------- полоса цифр: линованная строка тетради ---------- */
.pj-facts {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  border-block: 1px solid var(--line);
  background: transparent;
}
@media (max-width: 1180px) { .pj-facts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px)  { .pj-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pj-fact {
  padding: clamp(20px, 2.8vw, 36px) clamp(16px, 2vw, 28px);
  display: grid; gap: 6px; align-content: center;
  border-left: 1px solid var(--line-2);
}
.pj-fact:first-child { border-left: 0; }
.pj-fact__n { font-family: var(--f-display); font-weight: 600; font-size: clamp(2.1rem, 4vw, 3.5rem); line-height: 1; display: block; }
.pj-fact--count .pj-fact__n { color: var(--candle); font-variant-numeric: tabular-nums; }
.pj-fact__l { display: block; font-family: var(--f-label); font-size: 0.875rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mute); }

/* ---------- выносная цитата ---------- */
.pj-band {
  position: relative; overflow: hidden; isolation: isolate;
  min-height: clamp(400px, 66svh, 760px);
  display: grid; place-items: center;
  background-color: var(--void);
  background-image: var(--laid), var(--chain);
}
.pj-band__v { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; opacity: .22; filter: saturate(.9); }
.pj-band__scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(80% 66% at 50% 50%, rgba(226,228,222,.6), rgba(226,228,222,.95) 74%); }
.pj-band__in { position: relative; z-index: 2; margin: 0; padding: clamp(40px, 7vw, 92px) var(--pad); display: grid; gap: clamp(18px, 2.6vw, 32px); justify-items: center; text-align: center; }
.pj-band__q { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.6rem, 4.6vw, 4rem); line-height: 1.18; color: var(--snow); text-wrap: balance; }
.pj-band__c { font-family: var(--f-hand); font-style: normal; font-size: 1.35rem; color: var(--candle); }

/* ---------- кнопки ---------- */
.pj-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: clamp(24px, 3vw, 36px); }
.pj-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 15px 30px; min-height: 48px;
  font-family: var(--f-label); font-size: 0.9375rem; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  border: 1px solid var(--candle); color: var(--candle);
  transition: background-color .22s, color .22s, border-color .22s;
}
.pj-btn:hover { background: var(--candle); color: var(--void); }
.pj-btn--solid { background: var(--candle); color: #F2F1EC; }
.pj-btn--solid:hover { background: var(--candle-d); border-color: var(--candle-d); color: #F2F1EC; }
.pj-btn--ghost { border-color: var(--field); color: var(--snow); }
.pj-btn--ghost:hover { border-color: var(--snow); background: rgba(42,33,24,.05); color: var(--snow); }

/* ---------- О выставке ---------- */
.pj-about { display: grid; gap: clamp(28px, 4vw, 56px); }
@media (min-width: 900px) { .pj-about { grid-template-columns: 1.2fr 1fr; align-items: start; } }
/* буквица — приём наборной полосы */
.pj-about .pj-lead::first-letter {
  float: left; font-family: var(--f-display); font-weight: 600;
  font-size: 3.5em; line-height: .82; padding: .06em .1em 0 0; color: var(--candle);
}
.pj-about__voices { display: grid; border-top: 1px solid var(--line); }
.pj-voice { padding: 16px 0; display: grid; gap: 4px; border-bottom: 1px solid var(--line-2); }
.pj-voice__n { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; }
.pj-voice__d { font-size: 0.9375rem; color: var(--mute); }

/* ---------- ЭПИЗОДЫ ---------- */
.pj-eps { position: relative; }
.pj-eps__inner { width: 100%; padding-inline: clamp(14px, 2.2vw, 34px); }
.pj-ep__head, .pj-ep__quote { padding-inline: clamp(4px, 1vw, 18px); }
.pj-eps__stage { position: sticky; top: 0; z-index: 1; height: 100svh; min-height: 620px; display: flex; flex-direction: column; justify-content: center; padding-block: 28px; }
.pj-eps__steps { position: relative; z-index: 2; margin-top: -100svh; pointer-events: none; }
.pj-eps__step { height: 82svh; }

.pj-eps__frames { display: grid; }
.pj-ep {
  grid-area: 1 / 1;
  opacity: 0; visibility: hidden;
  transition: opacity .5s ease, visibility .5s;
  display: grid; gap: clamp(14px, 2vw, 26px); align-content: center;
}
.pj-ep.is-on { opacity: 1; visibility: visible; }
.pj-ep__head { display: flex; align-items: baseline; gap: 14px 22px; flex-wrap: wrap; }
.pj-ep__years { font-family: var(--f-label); font-size: 1rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--candle); }
.pj-ep__t { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.6rem, 3.4vw, 3rem); line-height: 1.04; }
.pj-ep__tri .pj-screen { aspect-ratio: auto; }
.pj-ep__tri .pj-screen--c { aspect-ratio: 16 / 10; }
/* зачёркнутая черта у цитаты — размашистая, как у него */
.pj-ep__quote { display: grid; gap: 8px; border-left: 2px solid var(--candle); padding-left: 20px; max-width: 80ch; }
.pj-ep__q { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.15rem, 1.8vw, 1.7rem); line-height: 1.34; color: var(--snow); }
.pj-ep__who { font-family: var(--f-hand); font-size: 1.125rem; color: var(--mute); }

.pj-rail { display: flex; align-items: center; gap: 12px; margin-top: clamp(16px, 2vw, 26px); padding-inline: clamp(4px, 1vw, 18px); }
.pj-rail__y { font-family: var(--f-label); font-size: 0.875rem; font-weight: 700; letter-spacing: 0.12em; color: var(--mute); font-variant-numeric: tabular-nums; }
.pj-rail__track { position: relative; flex: 1; display: flex; align-items: center; height: 28px; }
.pj-rail__track::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.pj-rail__dot { position: relative; flex: 1; height: 28px; display: grid; place-items: center; }
.pj-rail__dot::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background-color .25s, transform .25s, box-shadow .25s; }
.pj-rail__dot[aria-current="true"]::after { background: var(--candle); transform: scale(1.7); box-shadow: 0 0 0 4px rgba(122,46,34,.12); }
.pj-rail__dot:hover::after { background: var(--snow); }

/* ---------- Карта маршрута ---------- */
.pj-map { display: grid; gap: clamp(20px, 3vw, 36px); }
@media (min-width: 980px) { .pj-map { grid-template-columns: 1.55fr 1fr; align-items: start; } }
.pj-map__fig { position: relative; border: 1px solid var(--line); background: var(--paper); }
.pj-map__svg { display: block; width: 100%; height: auto; }
.pj-map__grid line { stroke: var(--line-2); stroke-width: 0.6; }
.pj-map__route { fill: none; stroke: var(--candle); stroke-width: 1.4; stroke-dasharray: 5 5; opacity: .7; }
.pj-map__pt circle { fill: var(--paper); stroke: var(--mute); stroke-width: 1.6; transition: stroke .22s, fill .22s; }
.pj-map__pt text { fill: var(--dim); font-family: var(--f-label); font-weight: 700; font-size: 14px; transition: fill .22s; }
.pj-map__pt { cursor: pointer; }
.pj-map__pt:hover circle, .pj-map__pt.is-on circle { fill: var(--candle); stroke: var(--candle); }
.pj-map__pt:hover text, .pj-map__pt.is-on text { fill: var(--snow); }
.pj-map__pt--end circle { stroke: var(--candle); }
.pj-map__info { border: 1px solid var(--line); background: var(--paper); padding: clamp(20px, 2.6vw, 30px); display: grid; gap: 12px; align-content: start; min-height: 220px; }
.pj-map__info-y { font-family: var(--f-hand); font-size: 1.25rem; color: var(--candle); }
.pj-map__info-t { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.5rem, 2.4vw, 2.1rem); line-height: 1.06; }
.pj-map__info-d { color: var(--dim); }

/* ---------- Технология ---------- */
.pj-tech { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); border-top: 1px solid var(--line); }
.pj-tech__i { padding: clamp(22px, 2.6vw, 34px) clamp(18px, 2vw, 28px); display: grid; gap: 10px; align-content: start; border-bottom: 1px solid var(--line-2); border-left: 1px solid var(--line-2); }
.pj-tech__i:first-child { border-left: 0; }
.pj-tech__n { font-family: var(--f-hand); font-size: 1.4rem; color: var(--candle); }
.pj-tech__t { font-family: var(--f-display); font-weight: 600; font-size: 1.4rem; }
.pj-tech__d { font-size: 0.9375rem; color: var(--dim); }

/* ---------- Галереи ---------- */
.pj-gal { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: clamp(12px, 1.6vw, 24px); }
.pj-gal__i {
  position: relative; aspect-ratio: 4 / 3; overflow: hidden;
  background: var(--frame); cursor: zoom-in;
  box-shadow: 0 0 0 1px rgba(42,33,24,.16), 0 12px 24px -18px rgba(42,33,24,.6);
  transition: transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .3s;
}
